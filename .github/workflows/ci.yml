name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck-syntax:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: bash -n every .sh file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            bash -n "$f" || status=1
          done < <(find . -name '*.sh' -not -path './Novus-Agenti/*' -print0)
          exit "$status"
